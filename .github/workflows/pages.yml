# Publica no GitHub Pages SOMENTE o artefato _site/ (lista de permissão em tools/dist.py): sem fontes, testes,
# documentação interna, configuração nem páginas de desenvolvimento.
#
# Segurança:
# - só roda em push na main ou manualmente; NUNCA em pull_request/pull_request_target (código de PR não roda aqui);
# - GITHUB_TOKEN sem permissão nenhuma por padrão; cada job recebe só o mínimo;
# - ações oficiais do GitHub fixadas por SHA do commit (uma tag movida não muda o que roda aqui);
# - nenhum segredo é usado; o build não instala dependências (só Python da própria máquina do GitHub).
#
# Ativação: GitHub → Settings → Pages → Source: "GitHub Actions" e descomentar o gatilho "push" abaixo.
name: Publicar site

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # as páginas já vêm geradas no repositório (src/build.py roda localmente); aqui só se separa e verifica o que é público
      - name: Montar e verificar o artefato
        run: python3 tools/dist.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
