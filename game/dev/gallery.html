<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Microgame gallery (dev)</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
  body { margin: 0; padding: 16px; background: #0d0d0b; color: #efece4; font: 13px/1.4 "JetBrains Mono", monospace; }
  .row { margin: 0 0 18px; }
  h2 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
  .cells { display: flex; flex-wrap: wrap; gap: 8px; }
  figure { margin: 0; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .grid .row { width: min-content; margin: 0; }
  .grid h2 { font-size: 11px; max-width: 100%; }
  canvas { display: block; border: 1px solid #3d3b36; }
  figcaption { color: #a8a498; font-size: 11px; }
</style>
</head>
<body>
<main id="gallery"></main>
<script src="/game/.dev/gallery.js"></script>
</body>
</html>
