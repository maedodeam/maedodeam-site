# Worker PRIVADO do dashboard — atrás do Cloudflare Access (só o seu e-mail) e verificando o token do Access no código.
name = "mm-telemetry-dashboard"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Endereço gratuito <nome>.<subdomínio>.workers.dev, protegido pelo Access.
# Sem URLs de versão/preview: seriam endereços alternativos fora da aplicação do Access.
workers_dev = true
preview_urls = false

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "mm-telemetry"
database_id = "b4186c83-39a2-4649-8cab-7280560600c4"
migrations_dir = "../migrations"

[vars]
# Domínio do time no Zero Trust (Settings → Custom Pages → Team domain), ex.: "maedodeam.cloudflareaccess.com"
ACCESS_TEAM_DOMAIN = "databairro.cloudflareaccess.com"   # time do Zero Trust já existente na conta
# Application Audience (AUD) Tag da aplicação do Access que protege este Worker
ACCESS_AUD = "d238e03be1eca55e65fe5a532fbd23c911d99bf7692dc869d61d9f628cda6100"   # política somente-dono-telemetria
ABANDON_AFTER_MIN = "30"
RANKING_MIN_ATTEMPTS = "30"
# ALLOWED_EMAILS NÃO fica aqui (o repositório é público): npx wrangler secret put ALLOWED_EMAILS

# ---------------------------------------------------------------------------------------------------------------
# AMBIENTE DE TESTE (staging): lê o banco de teste. Também atrás do Access (aplicação própria → AUD próprio).
# Publicar: npx wrangler deploy --env staging   ·   Secret: npx wrangler secret put ALLOWED_EMAILS --env staging
[env.staging]
name = "mm-telemetry-dashboard-staging"
workers_dev = true
preview_urls = false

[env.staging.observability]
enabled = false

[[env.staging.d1_databases]]
binding = "DB"
database_name = "mm-telemetry-staging"
database_id = "dcb96219-cf94-4d3a-9926-1faa910d1f19"
migrations_dir = "../migrations"

[env.staging.vars]
ACCESS_TEAM_DOMAIN = "databairro.cloudflareaccess.com"   # time do Zero Trust já existente na conta
ACCESS_AUD = "9fc15b4436133261f7f7165a66fd3a946729856ac09d57d615e288a76899b493"
ABANDON_AFTER_MIN = "5"        # curto no teste, para ver "sem fim registrado" sem esperar 30 min
RANKING_MIN_ATTEMPTS = "1"
