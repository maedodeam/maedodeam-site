# Worker PÚBLICO de ingestão — só POST /v1/events. Nada de leitura nem administração aqui.
# Ainda NÃO publicado. Ver telemetry/README.md ("Ativação") antes de qualquer deploy.
name = "mm-telemetry-ingest"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Endereço gratuito <nome>.<subdomínio>.workers.dev. Sem URLs de versão/preview (endereços alternativos).
workers_dev = true
preview_urls = false

# Sem logs de requisição na Cloudflare (eles guardariam metadados como IP).
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "mm-telemetry"
database_id = "COLE_AQUI_O_ID_DO_D1"   # saída de: npx wrangler d1 create mm-telemetry
migrations_dir = "../migrations"

[vars]
ALLOWED_ORIGINS = "https://maedodeam.com.br"
RETENTION_DAYS = "180"   # igual a retention_days em telemetry/client.config.json (o teste confere)

# Limite por IP no limitador da própria Cloudflare (o IP não chega ao banco).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 10 }   # por IP e por local da Cloudflare; janela de 10s reage a rajadas (a de 60s não reagiu no teste)

# Retenção: apaga as métricas com mais de RETENTION_DAYS dias (30–400), todo dia às 03:17 UTC.
[triggers]
crons = ["17 3 * * *"]

# ---------------------------------------------------------------------------------------------------------------
# AMBIENTE DE TESTE (staging): Worker e banco separados, aceitando só o jogo rodando local (127.0.0.1:8765).
# Publicar: npx wrangler deploy --env staging   ·   Os dados de teste nunca se misturam com os de produção.
[env.staging]
name = "mm-telemetry-ingest-staging"
workers_dev = true
preview_urls = false

[env.staging.observability]
enabled = false

[[env.staging.d1_databases]]
binding = "DB"
database_name = "mm-telemetry-staging"
database_id = "dcb96219-cf94-4d3a-9926-1faa910d1f19"   # saída de: npx wrangler d1 create mm-telemetry-staging
migrations_dir = "../migrations"

[env.staging.vars]
ALLOWED_ORIGINS = "http://127.0.0.1:8765,http://localhost:8765"
RETENTION_DAYS = "180"

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 10 }   # por IP e por local da Cloudflare; janela de 10s reage a rajadas (a de 60s não reagiu no teste)

# sem cron no teste (o plano gratuito tem 5 crons por conta)
[env.staging.triggers]
crons = []
